<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jardín Mágico 6.0</title><style>*{box-sizing:border-box}body{margin:0;background:#102e29;color:white;font:16px system-ui}button,input,select,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid #ffffff55}button{background:#24574a;color:white;cursor:pointer}canvas{width:100vw;height:100dvh;display:block;touch-action:none}#hud,#actions,#joy,#msg,#panel,#home{position:fixed}#hud{top:12px;left:12px;background:#102e29dd;padding:12px;border-radius:12px}#actions{bottom:15px;right:12px;display:grid;grid-template-columns:repeat(2,auto);gap:5px}#joy{bottom:20px;left:20px;width:110px;height:110px;border:2px solid white;border-radius:50%;touch-action:none;background:#1238}#knob{position:absolute;left:34px;top:34px;width:40px;height:40px;background:#fff9;border-radius:50%}#msg{bottom:175px;left:5%;width:90%;text-align:center;text-shadow:0 2px 4px black;pointer-events:none}#panel{inset:8% 5% auto;max-height:78dvh;overflow:auto;background:#142e29f7;border:1px solid #8cba9b;padding:16px;border-radius:18px}#home{inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at top,#518e74,#102e29 70%);gap:12px}h1{font-size:clamp(32px,7vw,70px);margin:0}p{margin:8px 0}textarea{width:100%} [hidden]{display:none!important}.line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border-bottom:1px solid #ffffff22}.line button{flex-shrink:0}small{color:#c8e2d4}#actions{bottom:125px;max-height:55dvh;overflow:auto}#menuToggle,#jumpTouch{position:fixed;right:18px;touch-action:manipulation;user-select:none;-webkit-user-select:none}#menuToggle{bottom:100px;width:44px;height:36px;padding:0;background:#173b32cc}#jumpTouch{bottom:18px;width:72px;height:72px;border-radius:50%;background:#ffffff28;border:2px solid #ffffff99;padding:15px}#jumpTouch:active{background:#ffffff66}#jumpTouch svg{width:100%;height:100%}#msg{bottom:100px;width:60%;left:20%}#home{z-index:4}#panel{z-index:5}@media(max-height:500px){#actions{max-height:42dvh}#actions button{padding:5px;font-size:12px}}</style><canvas id="c"></canvas><div id="hud"></div><div id="joy"><div id="knob"></div></div><div id="actions" hidden></div><button id="menuToggle" aria-label="Mostrar botones" aria-expanded="false">▲</button><button id="jumpTouch" aria-label="Saltar"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5 L43 24 H32 V43 H16 V24 H5 Z" fill="white"/></svg></button><div id="msg"></div><div id="panel" hidden></div><div id="home"><h1>🌿 Jardín Mágico</h1><h2>6.0 · El multiverso</h2><button onclick="home.hidden=true">Jugar</button><button onclick="openMenu('Amigos')">Amigos</button><button onclick="openMenu('Guardar')">Partidas</button><button onclick="openMenu('Novedades')">Novedades</button></div><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d'),home=$('home'),panel=$('panel');const base=[['Margarita',3,5,'#fff'],['Tulipán',7,10,'#ff659f'],['Girasol',10,15,'#ffda42'],['Cerezo',15,20,'#ffb6da',6],['Rosa',23,30,'#ed4560'],['Lavanda',40,50,'#b18bf7'],['Flor lunar',150,250,'#c9e8ff'],['Loto estelar',500,1500,'#73f7ff'],['Flor del vacío',5000,10000,'#8c45e7'],['Árbol divino',50000,75000,'#ffec9a',8],['Flor cósmica',120000,180000,'#ff78ee'],['Árbol eterno',500000,800000,'#91fff0',10],...['Beanstalk','Tomate','Limón','Naranja','Manzana','Calabaza','Sandía','Patata','Bambú','Higo','Melocotón','Mango celestial','Planta carnívora universal','Fruta del dragón esquelético'].map((n,i)=>[n,1000*3**i,1600*3**i,['#8de36b','#f45544','#f9df45','#ff982f'][i%4],[5,5,6,6,8,0,0,0,4,5,6,10,3,4][i]]),...['Rosa de antimateria','Planta del caos','Árbol de las galaxias','Fruta del infinito','Árbol creador de universos'].map((n,i)=>[n,1e12*10**i,1.6e12*10**i,'#a977ff',5,true])];const pets=['Conejo','Gato','Perro','Zorro','Dragón','Unicornio','Fénix','Fénix divino','Gallina','Rana','Tortuga','Ardilla','Erizo','Panda','Búho','Camaleón','Tigre','Lobo','Ajolote','Grifo','Pegaso','Dragón celestial','Zorro cósmico','Fénix galáctico','Caracol espacial','Tortuga meteorito','Lobo cósmico','Fénix meteórico','Dragón del apocalipsis','Dragón esquelético','Hidra oscura','Kraken universal','Abeja','Mariposa dorada','Zorro lunar','Dragón arcoíris','Dragón cósmico','Unicornio cósmico','Titán Supremo','Lobo del Tiempo','Fénix de la Eternidad','Zorro de las Nueve Dimensiones','Hidra del Multiverso','Serpiente del Infinito','Devorador del Mundo','Creador de Universos'];const eggs=[['Común',1000,30,[8,0,2,1]],['Poco común',15000,120,[9,10,11,12]],['Raro',100000,300,[3,13,14,15]],['Épico',750000,900,[16,17,18,5]],['Legendario',5e6,3600,[4,6,19,20]],['Celestial',5e7,14400,[21,22,23]],['Meteorito',75e6,21600,[24,25,26,27,28],[45,30,20,4.9,.1]],['Prohibido',5e8,43200,[29,30,31]],['Vacío',5e13,86400,[42,43,44]],['Secreto',100,60,[32,2,33,34,35,36,7,37],[50,22,10,8,5,4,.9,.1]],['Multiverso',5e14,172800,[38,39,40,41,42,43,44,45],[40,30,20,7,2.5,.49,.0099,.0001]]];let S={coins:3,bag:[],sel:0,plants:{},owned:[],equipped:-1,x:4,z:-3,yaw:0,pitch:-.2,eggs:[],custom:[],deleted:[],edits:{},farm:0,sanctuary:0,gear:[],zone:'garden',event:'Normal',until:0};try{Object.assign(S,JSON.parse(localStorage.getItem('jm6')||'{}'))}catch{}function save(){try{localStorage.setItem('jm6',JSON.stringify(S))}catch{say('No se pudo guardar en este navegador')}}function seeds(){return [...base,...S.custom].map((s,i)=>S.edits[i]||s)}function say(t){$('msg').textContent=t}function fmt(n){return Math.round(n).toLocaleString('es-ES')}function line(t,b,fn){let r=document.createElement('div');r.className='line';let a=document.createElement('span');a.textContent=t;r.append(a);if(b){let k=document.createElement('button');k.textContent=b;k.onclick=fn;r.append(k)}panel.append(r)}function openMenu(n){panel.hidden=false;panel.replaceChildren();line(n,'Cerrar',()=>panel.hidden=true);let ss=seeds();if(n==='Tienda'||n==='Mochila'||n==='Vendedor secreto'){ss.forEach((s,i)=>{if(S.deleted.includes(i)||!!s[5]!== (n==='Vendedor secreto')&&n!=='Mochila')return;line(s[0]+' · '+(n==='Mochila'?'×'+(S.bag[i]||0):fmt(s[1])+' 🪙'),n==='Mochila'?'Elegir':'Comprar',()=>{if(n!=='Mochila'){if(S.coins<s[1])return say('No tienes monedas suficientes');S.coins-=s[1];S.bag[i]=(S.bag[i]||0)+1}S.sel=i;save();panel.hidden=true;say('Elegida: '+s[0])})})}else if(n==='Huevos'){eggs.forEach((e,i)=>{if(i===8&&S.zone!=='void'||i===6&&S.event!=='Meteoritos')return;line(e[0]+' · '+fmt(e[1])+' · '+e[2]+' s','Comprar',()=>{if(S.coins<e[1])return say('No tienes monedas');S.coins-=e[1];S.eggs.push({i,end:Date.now()+e[2]*1000});save();openMenu(n)})});S.eggs.forEach((a,j)=>line(eggs[a.i][0]+' · '+Math.max(0,Math.ceil((a.end-Date.now())/1000))+' s','Abrir',()=>{if(Date.now()<a.end)return say('Todavía incubando');let e=eggs[a.i],r=Math.random()*100,k=0;if(e[4]){while(k<e[3].length-1&&r>=e[4][k])r-=e[4][k++]}else k=Math.floor(Math.random()*e[3].length);let id=e[3][k];if(!S.owned.includes(id))S.owned.push(id);S.eggs.splice(j,1);save();say('¡'+pets[id]+'!');openMenu(n)}))}else if(n==='Mascotas'){S.owned.forEach(i=>line(pets[i]||'Mascota',S.equipped===i?'Equipado':'Equipar',()=>{S.equipped=i;save();openMenu(n)}));line('Tienda de mascotas','Abrir',()=>openMenu('Tienda de mascotas'))}else if(n==='Tienda de mascotas'){pets.slice(0,8).forEach((p,i)=>line(p+' · '+fmt(100*5**i),'Comprar',()=>{if(S.coins<100*5**i)return say('Faltan monedas');S.coins-=100*5**i;if(!S.owned.includes(i))S.owned.push(i);save();openMenu(n)}))}else if(n==='Equipamiento'){['Regadera','Aspersor','Pala mágica'].forEach((v,i)=>line(v+' · '+1000*(i+1),'Comprar',()=>{if(S.gear.includes(i)||S.coins<1000*(i+1))return;S.coins-=1000*(i+1);S.gear.push(i);save();say('Comprado')}))}else if(n==='Minigranja'||n==='Santuario'){let key=n==='Minigranja'?'farm':'sanctuary';line('Capacidad '+S[key]+'/10','Mejorar',()=>{let cost=1000*(S[key]+1);if(S[key]>=10||S.coins<cost)return say('Capacidad máxima o monedas insuficientes');S.coins-=cost;S[key]++;save();openMenu(n)});line('Mascotas disponibles: '+S.owned.map(i=>pets[i]).join(', '))}else if(n==='Guardar'){let t=document.createElement('textarea');t.value=btoa(unescape(encodeURIComponent(JSON.stringify({...S,v:60}))));panel.append(t);line('Copia el código o pega uno anterior','Cargar',()=>{try{let a=JSON.parse(decodeURIComponent(escape(atob(t.value.trim()))));if(![41,50,60].includes(a.v)||!Number.isFinite(a.coins)||!Array.isArray(a.bag)||!a.plants)throw Error();Object.assign(S,a);save();panel.hidden=true;say('Partida recuperada')}catch{say('Código incorrecto')}})}else if(n==='Creador'){line('Modo creador local (sin seguridad de servidor)');line('Monedas','+1 billón',()=>{S.coins+=1e12;save()});line('Todas las mascotas','Obtener',()=>{S.owned=pets.map((_,i)=>i);save()});['Meteoritos','Agujero negro','Eclipse','Evento del Creador'].forEach(e=>line(e,'Activar',()=>event(e)));line('Isla del creador','Ir',()=>{travel('creator');panel.hidden=true});line('Editor de plantas y diseños','Abrir',()=>openMenu('Editor'));line('Actualizaciones locales','Abrir',()=>openMenu('Novedades'))}else if(n==='Editor'){line('Crear planta nueva','Añadir',()=>{let name=prompt('Nombre');if(!name)return;let price=Number(prompt('Precio','1000')),value=Number(prompt('Valor de venta','2000')),color=prompt('Color hexadecimal','#ff66cc'),count=Number(prompt('Frutos simultáneos (0 = no permanente)','0'));if(!Number.isFinite(price)||price<0||!Number.isFinite(value)||value<0)return;S.custom.push([name,price,value,/^#[0-9a-f]{6}$/i.test(color)?color:'#ff66cc',Math.max(0,Math.min(20,count||0))]);save();openMenu(n)});ss.forEach((s,i)=>{line(s[0],S.deleted.includes(i)?'Recuperar':'Eliminar',()=>{if(S.deleted.includes(i))S.deleted=S.deleted.filter(v=>v!==i);else if(confirm('Retirar de la tienda?'))S.deleted.push(i);save();openMenu(n)});if(!S.deleted.includes(i))line('Diseño y precio','Editar',()=>{let a=[...s],v=prompt('Nombre',a[0]);if(!v)return;a[0]=v;let col=prompt('Color',a[3]);if(/^#[0-9a-f]{6}$/i.test(col))a[3]=col;let p=Number(prompt('Precio',a[1]));if(Number.isFinite(p)&&p>=0)a[1]=p;S.edits[i]=a;save();openMenu(n)})})}else if(n==='Novedades'){line('6.0 · Prototipo local');line('Cambios del editor guardados en este navegador.');line('Publicación global, editor 3D completo y multijugador pendientes.')}else if(n==='Amigos'){line('El multijugador necesita un servidor; todavía no está disponible.')}else if(n==='Viajar'){line('Jardín','Ir',()=>travel('garden'));line('Isla del creador','Ir',()=>travel('creator'));if(S.event==='Agujero negro'||S.zone==='void')line('Agujero negro','Entrar',()=>travel('void'))} }
function travel(zone){S.zone=zone;S.x=4;S.z=-3;S.yaw=0;panel.hidden=true;save();say(zone==='void'?'Dimensión del agujero negro':zone==='creator'?'Isla del Creador':'Jardín')}
function event(e){S.event=e;S.until=Date.now()+(e==='Agujero negro'?120000:180000);save();say(e)}let next=Date.now()+600000,lastImpact=0;const plots=Array.from({length:40},(_,i)=>[i%5*2,Math.floor(i/5)*1.8+1]);let W,H,joy=[0,0],height=0,vel=0,last=performance.now();function resize(){W=c.width=c.clientWidth;H=c.height=c.clientHeight}onresize=resize;resize();function cam(X,Z,Y){let dx=X-S.x,dz=Z-S.z,h=Y-1.65-height,f=dz*Math.cos(S.yaw)+dx*Math.sin(S.yaw);return [dx*Math.cos(S.yaw)-dz*Math.sin(S.yaw),h*Math.cos(S.pitch)-f*Math.sin(S.pitch),f*Math.cos(S.pitch)+h*Math.sin(S.pitch)]}function project(p){return [W/2+p[0]*H*.78/p[2],H/2-p[1]*H*.78/p[2]]}function poly(v,col){let a=v.map(p=>cam(...p)),b=[];for(let i=0;i<a.length;i++){let p=a[i],q=a[(i+1)%a.length],u=p[2]>=.08,t=q[2]>=.08;if(u)b.push(p);if(u!==t){let k=(.08-p[2])/(q[2]-p[2]);b.push(p.map((n,j)=>n+(q[j]-n)*k))}}if(b.length<3)return;g.fillStyle=col;g.beginPath();b.map(project).forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fill()}function cube(X,Z,Y,w,d,h,col){let b=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([i,j])=>[X+i*w/2,Z+j*d/2,Y]),t=b.map(p=>[p[0],p[1],Y+h]);[0,1,2,3].sort((i,j)=>cam(...b[j])[2]-cam(...b[i])[2]).forEach(i=>{let j=(i+1)%4,v=[b[i],b[j],t[j],t[i]];poly(v,col);poly(v,i%2?'#0003':'#0001')});poly(t,col);poly(t,'#fff3')}function orb(X,Z,Y,r,col){let p=cam(X,Z,Y);if(p[2]<.2)return;let [a,b]=project(p),rr=Math.min(500,r*H*.78/p[2]);let gr=g.createRadialGradient(a-rr*.3,b-rr*.3,0,a,b,rr);gr.addColorStop(0,'#ffffff');gr.addColorStop(.35,col);gr.addColorStop(1,'#172c29');g.fillStyle=gr;g.beginPath();g.arc(a,b,rr,0,7);g.fill()}function label(X,Z,Y,t){let p=cam(X,Z,Y);if(p[2]<.3)return;let [a,b]=project(p);g.font='bold '+Math.max(12,Math.min(24,220/p[2]))+'px system-ui';g.textAlign='center';g.fillStyle='white';g.fillText(t,a,b)}function target(){let best=-1,d=H*.4;plots.forEach(([X,Z],i)=>{let p=cam(X,Z,.15);if(p[2]<.1)return;let q=project(p),r=Math.hypot(q[0]-W/2,q[1]-H/2);if(r<d){d=r;best=i}});return best}function fruits(p,s){return Math.max(0,Math.min(s[4]||0,Math.floor((Date.now()-p.time-3200)/60000)*(s[4]||0)-(p.harvested||0)))}function plant(){if(S.zone!=='garden')return say('Vuelve al jardín');let i=target();if(i<0||S.plants[i]||!S.bag[S.sel])return say('Elige una semilla y mira una parcela libre');let r=Math.random(),q=Math.random();S.plants[i]={seed:S.sel,time:Date.now(),mut:r<.01?'Arcoíris':r<.11?'Dorada':'Normal',mult:r<.01?5:r<.11?2:1,size:q<.01?3:q<.06?2:q<.26?1.5:1};S.bag[S.sel]--;save()}function sell(){let total=0,ss=seeds();for(let i in S.plants){let p=S.plants[i],s=ss[p.seed];if(!s||Date.now()-p.time<3200)continue;let v=Math.ceil(s[2]*p.mult*p.size*([1.1,1.2,1.3,1.5,2,2,5,10][S.equipped]||1));if(s[4]){let n=fruits(p,s);total+=n*v;if(n)p.time=Date.now()-3200,p.harvested=0}else{total+=v;delete S.plants[i]}}S.coins+=total;save();say('Vendiste por '+fmt(total))}function draw(){let now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;S.x+= (Math.cos(S.yaw)*joy[0]-Math.sin(S.yaw)*joy[1])*5*dt;S.z+=(-Math.sin(S.yaw)*joy[0]-Math.cos(S.yaw)*joy[1])*5*dt;S.x=Math.max(-25,Math.min(40,S.x));S.z=Math.max(-20,Math.min(55,S.z));if(height||vel){height+=vel*dt;vel-=9.8*dt;if(height<0)height=vel=0}let t=Date.now();if(t>next){next=t+600000;let r=Math.random();if(r<.005)event('Agujero negro');else if(r<.055)event('Meteoritos')}if(S.event!=='Normal'&&t>S.until){S.event='Normal';if(S.zone==='void')travel('garden');save()}if(t-lastImpact>5000&&['Meteoritos','Agujero negro'].includes(S.event)){lastImpact=t;let a=Object.values(S.plants);if(a.length&&Math.random()<(S.event==='Meteoritos'?.3:.15)){let p=a[Math.floor(Math.random()*a.length)],m=S.event==='Meteoritos'?'Meteorito':'Vacío';if(!p.mut.includes(m)){p.mut+=' + '+m;p.mult*=m==='Vacío'?100:10;save()}}}let voided=S.zone==='void',night=Math.floor(t/45000)%2;let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,voided?'#100421':night?'#151c46':'#4399ce');sky.addColorStop(1,voided?'#623e87':'#d8f1c
