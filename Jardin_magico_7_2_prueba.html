let inObby=false,stage=0,platforms=[],lasers=[];for(let i=0;i<8;i++){let x=19+i*3.1,z=-29+Math.sin(i*1.4)*1.4;platforms.push([x,z]);box(x,.65,z,2.1,1.3,2.2,mat(0x8c74b8));if(i>0&&i<7){let laser=box(x,.95,z,2.1,.09,.09,new T.MeshBasicMaterial({color:0xff2020}));lasers.push(laser)}let g=new T.Group();scene.add(g);g.position.set(x,0,z+2);cyl(0,.4,0,.08,.12,.8,leaf,g);ball(0,.85,0,.5,.22,.45,mat(0xb83959),g);for(let j=0;j<5;j++)mesh(new T.ConeGeometry(.07,.2,8),mat(0xffffff),-.32+j*.16,1,.25,g)}const oldTeleport=teleport;teleport=function(x,z,y){inObby=false;oldTeleport(x,z,y)};$('obby').onclick=()=>{teleport(...platforms[0],1.3);inObby=true;stage=0;notice('Salta entre plataformas y esquiva los rayos')};function updateGame(dt){let i=targetPlot();marker.visible=i>=0;if(i>=0)marker.position.set(plots[i][0],.23,plots[i][1]);for(let k in models){let p=state.plants[k],m=models[k];if(!p)continue;m.scale.setScalar(p.size*Math.max(.12,Math.min(1,(Date.now()-p.time)/3200)));let n=catalog[p.id][5]?ripe(p):0,f=m.userData.fruits;if(f.children.length!==n){f.clear();for(let j=0;j<n;j++){let a=j*2.4;ball(Math.cos(a)*.55,m.userData.h*.72,Math.sin(a)*.55,.14,.19,.14,m.userData.color,f)}}}if(inObby){let t=performance.now()/1000;lasers.forEach((l,j)=>{l.position.y=1.45+Math.sin(t*2+j)*.55});let idx=platforms.findIndex(([x,z])=>Math.abs(pos.x-x)<1.05&&Math.abs(pos.z-z)<1.1);base=idx>=0?1.3:0;if(idx===stage+1&&pos.y<3.15){stage++;if(stage===7){state.coins+=500;saveGame();teleport(0,19,0);notice('¡Obby completado! +500 monedas')}}if(inObby&&(pos.y<2.1||lasers.some(l=>Math.abs(pos.x-l.position.x)<1&&Math.abs(pos.z-l.position.z)<.18&&Math.abs(pos.y-1-l.position.y)<.28))){oldTeleport(...platforms[0],1.3);stage=0;notice('Inténtalo otra vez')}}}notice('Compra una semilla para empezar');frame();
