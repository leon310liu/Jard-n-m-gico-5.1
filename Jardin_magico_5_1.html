const j=$('joy');function joystick(e){let r=j.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.max(1,Math.hypot(dx,dy)/40);joy=[dx/d/40,dy/d/40];$('knob').style.transform=`translate(${dx/d}px,${dy/d}px)`}j.onpointerdown=e=>{j.setPointerCapture(e.pointerId);joystick(e)};j.onpointermove=e=>{if(j.hasPointerCapture(e.pointerId))joystick(e)};j.onpointerup=j.onpointercancel=()=>{joy=[0,0];$('knob').style.transform='none'};
